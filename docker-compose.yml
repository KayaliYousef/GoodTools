services:
  web:
    image: kayaliyousef/goodtools:latest          # use the image you already built
    container_name: good_tools  # optional, easier naming
    ports:
      - "8000:8000"            # maps host port 8000 → container port 8000
    restart: always            # auto restart if the container crashes
    command: flask run --host=0.0.0.0 --port=8000